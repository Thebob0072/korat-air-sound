        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Sound arcs (right) -->
  <path d="M24 13 Q27.5 16 24 19"
        stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M26.5 10.5 Q31.5 16 26.5 21.5"
