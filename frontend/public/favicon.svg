<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>

  <!-- Snowflake (top-left) -->
  <g stroke="#7dd3fc" stroke-linecap="round" stroke-width="1.4">
    <line x1="5" y1="3.5" x2="5" y2="10.5"/>
    <line x1="1.5" y1="7" x2="8.5" y2="7"/>
    <line x1="2.5" y1="4.5" x2="7.5" y2="9.5"/>
    <line x1="7.5" y1="4.5" x2="2.5" y2="9.5"/>
  </g>

  <!-- K letter -->
  <path d="M10 8v16M10 16l10-8M10 16l10 8"
